<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 695"
     shape-rendering="crispEdges">
  <defs>
    <style type="text/css"><![CDATA[
      @import url("https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap");
      .wordmark {
        font-family: "Press Start 2P", "PressStart2P", "VT323", monospace;
        font-weight: normal;
        letter-spacing: 0;
      }
      .scanline { stroke: #1A37BE; stroke-width: 1; fill: none; opacity: 0.35; }
    ]]></style>
  </defs>
  <polygon points="300,3 597,170 597,525 300,693 3,525 3,170"
           fill="#000000" stroke="#FFFFFF" stroke-width="6"/>
  <g class="scanline">
    <line x1="40" y1="220" x2="560" y2="220"/>
    <line x1="40" y1="260" x2="560" y2="260"/>
    <line x1="40" y1="300" x2="560" y2="300"/>
    <line x1="40" y1="340" x2="560" y2="340"/>
    <line x1="40" y1="380" x2="560" y2="380"/>
    <line x1="40" y1="420" x2="560" y2="420"/>
  </g>
  <!-- D-pad cross (light grey). Vertical arm spans y=240..400;
       horizontal arm spans x=140..260 at y=280..360. Centre at
       (200, 320). -->
  <rect x="180" y="240" width="40" height="40" fill="#B7B7B7"/>
  <rect x="180" y="280" width="40" height="40" fill="#B7B7B7"/>
  <rect x="180" y="320" width="40" height="40" fill="#B7B7B7"/>
  <rect x="180" y="360" width="40" height="40" fill="#B7B7B7"/>
  <rect x="140" y="280" width="40" height="40" fill="#B7B7B7"/>
  <rect x="140" y="320" width="40" height="40" fill="#B7B7B7"/>
  <rect x="220" y="280" width="40" height="40" fill="#B7B7B7"/>
  <rect x="220" y="320" width="40" height="40" fill="#B7B7B7"/>
  <!-- D-pad notches -->
  <rect x="190" y="290" width="20" height="20" fill="#000000"/>
  <rect x="190" y="330" width="20" height="20" fill="#000000"/>
  <!-- A and B buttons (light red, 80x80) at the same height as the
       D-pad's horizontal arm: y=280..360, vertically centred at
       y=320 like the cross. -->
  <rect x="340" y="280" width="80" height="80" fill="#FF7172"/>
  <rect x="440" y="280" width="80" height="80" fill="#FF7172"/>
  <!-- Button centre dots -->
  <rect x="370" y="310" width="20" height="20" fill="#000000"/>
  <rect x="470" y="310" width="20" height="20" fill="#000000"/>

  <text class="wordmark" x="300" y="565" text-anchor="middle"
        font-size="60" fill="#FFFFFF">replayr</text>
</svg>

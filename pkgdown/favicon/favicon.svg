      <g><rect x="0" y="66" width="36" height="18"></rect><rect x="40" y="66" width="36" height="18"></rect><rect x="80" y="66" width="36" height="18"></rect><rect x="120" y="66" width="36" height="18"></rect><rect x="160" y="66" width="36" height="18"></rect><rect x="200" y="66" width="36" height="18"></rect><rect x="240" y="66" width="36" height="18"></rect><rect x="280" y="66" width="36" height="18"></rect><rect x="320" y="66" width="36" height="18"></rect></g>

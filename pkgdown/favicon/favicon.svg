<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 695" width="600" height="695"><metadata><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/"><rdf:Description><dc:creator>RealFaviconGenerator</dc:creator><dc:source>https://realfavicongenerator.net</dc:source></rdf:Description></rdf:RDF></metadata><polygon points="300,3 597,170 597,525 300,693 3,525 3,170" fill="#0e1b2c" stroke="#7be0ad" stroke-width="6"></polygon><g transform="translate(120 200)">

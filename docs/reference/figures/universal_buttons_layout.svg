<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 720" font-family="Georgia, 'Times New Roman', serif" role="img" aria-labelledby="ubl-title">
  <title id="ubl-title">replayr universal controller layout</title>
  <desc>Two figures side by side. FIG. 1 is a fantasy gamepad covering universal slots 1-30 (d-pad, Start/Select/Mode, six face buttons, two shoulders, two triggers, four C-buttons, eight stick directions). FIG. 2 is the Intellivision/ColecoVision numeric keypad (slots 31-40), with Enter and Clear folding into Start (5) and Select (6).</desc>

  <defs>
    <style>
      .body     { fill: #fdfaf3; stroke: #111; stroke-width: 1.8; }
      .button   { fill: #ffffff; stroke: #111; stroke-width: 1.4; }
      .ink      { fill: none; stroke: #111; stroke-width: 1.5; stroke-linejoin: round; }
      .num-on-btn  { font: 700 11px Georgia, serif; fill: #111; text-anchor: middle; }
      .lbl-on-btn  { font: 600 10px Georgia, serif; fill: #444; text-anchor: middle; }
      .center-lbl  { font: 400 10px Georgia, serif; fill: #111; text-anchor: middle; letter-spacing: .5px; }
      .compass     { font: 600 10px Georgia, serif; fill: #444; text-anchor: middle; }
      .dpad-num    { font: 700 14px Georgia, serif; fill: #111; text-anchor: middle; }
      .legend      { font: 11px Georgia, serif; fill: #111; }
      .legend-num  { font: 700 11px Georgia, serif; fill: #111; text-anchor: end; }
      .legend-head { font: 700 12px Georgia, serif; fill: #111; letter-spacing: 1px; }
      .figcap      { font: 700 16px Georgia, serif; fill: #111; letter-spacing: 1.5px; text-anchor: middle; }
      .subcap      { font: 600 11px Georgia, serif; fill: #444; text-anchor: middle; }
      .keypad-digit { font: 400 22px Georgia, serif; fill: #111; text-anchor: middle; }
      .keypad-word  { font: 400 13px Georgia, serif; fill: #111; text-anchor: middle; letter-spacing: .5px; }
    </style>
  </defs>

  <rect x="0" y="0" width="1320" height="720" fill="#f5efe1"/>
  <line x1="900" y1="40" x2="900" y2="680" stroke="#aaa" stroke-width="0.6" stroke-dasharray="3 4"/>

  <!-- FIG. 1 -->
  <g>
    <g transform="translate(20,75)">
      <text class="legend-head" x="0" y="0">LEFT GROUP</text>
      <g transform="translate(0,18)">
        <text class="legend-num" x="22" y="0">11</text><text class="legend" x="30" y="0">L shoulder</text>
        <text class="legend-num" x="22" y="18">29</text><text class="legend" x="30" y="18">L2 trigger</text>
        <text class="legend-num" x="22" y="44">1</text><text class="legend" x="30" y="44">D-pad Right</text>
        <text class="legend-num" x="22" y="62">2</text><text class="legend" x="30" y="62">D-pad Left</text>
        <text class="legend-num" x="22" y="80">3</text><text class="legend" x="30" y="80">D-pad Down</text>
        <text class="legend-num" x="22" y="98">4</text><text class="legend" x="30" y="98">D-pad Up</text>
        <text class="legend-num" x="22" y="124">21</text><text class="legend" x="30" y="124">Stick-E</text>
        <text class="legend-num" x="22" y="142">22</text><text class="legend" x="30" y="142">Stick-NE</text>
        <text class="legend-num" x="22" y="160">23</text><text class="legend" x="30" y="160">Stick-N</text>
        <text class="legend-num" x="22" y="178">24</text><text class="legend" x="30" y="178">Stick-NW</text>
        <text class="legend-num" x="22" y="196">25</text><text class="legend" x="30" y="196">Stick-W</text>
        <text class="legend-num" x="22" y="214">26</text><text class="legend" x="30" y="214">Stick-SW</text>
        <text class="legend-num" x="22" y="232">27</text><text class="legend" x="30" y="232">Stick-S</text>
        <text class="legend-num" x="22" y="250">28</text><text class="legend" x="30" y="250">Stick-SE</text>
      </g>
    </g>

    <g transform="translate(770,75)">
      <text class="legend-head" x="0" y="0">RIGHT GROUP</text>
      <g transform="translate(0,18)">
        <text class="legend-num" x="22" y="0">12</text><text class="legend" x="30" y="0">R shoulder</text>
        <text class="legend-num" x="22" y="18">30</text><text class="legend" x="30" y="18">R2 trigger</text>
        <text class="legend-num" x="22" y="44">7</text><text class="legend" x="30" y="44">B</text>
        <text class="legend-num" x="22" y="62">8</text><text class="legend" x="30" y="62">A</text>
        <text class="legend-num" x="22" y="80">9</text><text class="legend" x="30" y="80">X</text>
        <text class="legend-num" x="22" y="98">10</text><text class="legend" x="30" y="98">Y</text>
        <text class="legend-num" x="22" y="116">13</text><text class="legend" x="30" y="116">C</text>
        <text class="legend-num" x="22" y="134">14</text><text class="legend" x="30" y="134">Z</text>
        <text class="legend-num" x="22" y="160">5</text><text class="legend" x="30" y="160">Start</text>
        <text class="legend-num" x="22" y="178">6</text><text class="legend" x="30" y="178">Select</text>
        <text class="legend-num" x="22" y="196">15</text><text class="legend" x="30" y="196">Mode</text>
        <text class="legend-num" x="22" y="222">17</text><text class="legend" x="30" y="222">C-Right</text>
        <text class="legend-num" x="22" y="240">18</text><text class="legend" x="30" y="240">C-Left</text>
        <text class="legend-num" x="22" y="258">19</text><text class="legend" x="30" y="258">C-Down</text>
        <text class="legend-num" x="22" y="276">20</text><text class="legend" x="30" y="276">C-Up</text>
      </g>
    </g>

    <g>
      <path class="body" d="M 200 245 C 200 175, 320 145, 440 145 C 560 145, 680 175, 680 245 L 680 410 C 680 490, 600 530, 530 530 L 350 530 C 280 530, 200 490, 200 410 Z"/>

      <rect class="button" x="225" y="138" width="56" height="20" rx="6"/>
      <text class="lbl-on-btn" x="253" y="151">L2</text>
      <text class="num-on-btn" x="253" y="135">29</text>
      <rect class="button" x="599" y="138" width="56" height="20" rx="6"/>
      <text class="lbl-on-btn" x="627" y="151">R2</text>
      <text class="num-on-btn" x="627" y="135">30</text>

      <rect class="button" x="225" y="165" width="76" height="16" rx="8"/>
      <text class="lbl-on-btn" x="263" y="176">L</text>
      <text class="num-on-btn" x="263" y="195">11</text>
      <rect class="button" x="579" y="165" width="76" height="16" rx="8"/>
      <text class="lbl-on-btn" x="617" y="176">R</text>
      <text class="num-on-btn" x="617" y="195">12</text>

      <g transform="translate(290,310)">
        <path class="button" d="M -17 -50 L 17 -50 L 17 -17 L 50 -17 L 50 17 L 17 17 L 17 50 L -17 50 L -17 17 L -50 17 L -50 -17 L -17 -17 Z"/>
        <text class="dpad-num" x="0"   y="-30">4</text>
        <text class="dpad-num" x="0"   y="40">3</text>
        <text class="dpad-num" x="-33" y="4">2</text>
        <text class="dpad-num" x="33"  y="4">1</text>
      </g>

      <g transform="translate(440,225)">
        <ellipse class="button" cx="-50" cy="0" rx="32" ry="13"/>
        <ellipse class="button" cx="50"  cy="0" rx="32" ry="13"/>
        <ellipse class="button" cx="0"  cy="22" rx="26" ry="11"/>
        <text class="center-lbl" x="-50" y="3">SELECT</text>
        <text class="center-lbl" x="50"  y="3">START</text>
        <text class="center-lbl" x="0"   y="25">MODE</text>
        <text class="num-on-btn" x="-50" y="-18">6</text>
        <text class="num-on-btn" x="50"  y="-18">5</text>
        <text class="num-on-btn" x="0"   y="44">15</text>
      </g>

      <g transform="translate(290,440)">
        <circle class="ink" cx="0" cy="0" r="46"/>
        <circle class="button" cx="0" cy="0" r="26"/>
        <text class="compass" x="0"   y="-56">N</text>
        <text class="compass" x="44"  y="-40">NE</text>
        <text class="compass" x="62"  y="3">E</text>
        <text class="compass" x="44"  y="48">SE</text>
        <text class="compass" x="0"   y="66">S</text>
        <text class="compass" x="-44" y="48">SW</text>
        <text class="compass" x="-62" y="3">W</text>
        <text class="compass" x="-44" y="-40">NW</text>
        <text class="num-on-btn" x="0" y="3">21–28</text>
      </g>

      <g transform="translate(575,310)">
        <circle class="button" cx="-34" cy="-22" r="18"/>
        <text class="num-on-btn" x="-34" y="-30">9</text>
        <text class="lbl-on-btn" x="-34" y="-15">X</text>
        <circle class="button" cx="6" cy="-32" r="18"/>
        <text class="num-on-btn" x="6" y="-40">10</text>
        <text class="lbl-on-btn" x="6" y="-25">Y</text>
        <circle class="button" cx="46" cy="-22" r="18"/>
        <text class="num-on-btn" x="46" y="-30">13</text>
        <text class="lbl-on-btn" x="46" y="-15">C</text>
        <circle class="button" cx="-34" cy="22" r="18"/>
        <text class="num-on-btn" x="-34" y="14">7</text>
        <text class="lbl-on-btn" x="-34" y="29">B</text>
        <circle class="button" cx="6" cy="32" r="18"/>
        <text class="num-on-btn" x="6" y="24">8</text>
        <text class="lbl-on-btn" x="6" y="39">A</text>
        <circle class="button" cx="46" cy="22" r="18"/>
        <text class="num-on-btn" x="46" y="14">14</text>
        <text class="lbl-on-btn" x="46" y="29">Z</text>
      </g>

      <g transform="translate(581,430)">
        <circle class="button" cx="0"   cy="-26" r="13"/>
        <text class="num-on-btn" x="0"  y="-22">20</text>
        <circle class="button" cx="0"   cy="26"  r="13"/>
        <text class="num-on-btn" x="0"  y="30">19</text>
        <circle class="button" cx="-28" cy="0"   r="13"/>
        <text class="num-on-btn" x="-28" y="4">18</text>
        <circle class="button" cx="28"  cy="0"   r="13"/>
        <text class="num-on-btn" x="28" y="4">17</text>
      </g>
      <text class="lbl-on-btn" x="581" y="490">C-buttons</text>
    </g>

    <text class="figcap" x="440" y="640">FIG. 1</text>
    <text class="subcap" x="440" y="660">gamepad — slots 1 – 30</text>
  </g>

  <!-- FIG. 2 -->
  <g transform="translate(920,0)">
    <rect class="body" x="40" y="145" width="320" height="385" rx="20"/>

    <rect class="button" x="65"  y="180" width="80" height="62" rx="6"/>
    <text class="num-on-btn" x="105" y="195">32</text>
    <text class="keypad-digit" x="105" y="225">1</text>
    <rect class="button" x="160" y="180" width="80" height="62" rx="6"/>
    <text class="num-on-btn" x="200" y="195">33</text>
    <text class="keypad-digit" x="200" y="225">2</text>
    <rect class="button" x="255" y="180" width="80" height="62" rx="6"/>
    <text class="num-on-btn" x="295" y="195">34</text>
    <text class="keypad-digit" x="295" y="225">3</text>

    <rect class="button" x="65"  y="262" width="80" height="62" rx="6"/>
    <text class="num-on-btn" x="105" y="277">35</text>
    <text class="keypad-digit" x="105" y="307">4</text>
    <rect class="button" x="160" y="262" width="80" height="62" rx="6"/>
    <text class="num-on-btn" x="200" y="277">36</text>
    <text class="keypad-digit" x="200" y="307">5</text>
    <rect class="button" x="255" y="262" width="80" height="62" rx="6"/>
    <text class="num-on-btn" x="295" y="277">37</text>
    <text class="keypad-digit" x="295" y="307">6</text>

    <rect class="button" x="65"  y="344" width="80" height="62" rx="6"/>
    <text class="num-on-btn" x="105" y="359">38</text>
    <text class="keypad-digit" x="105" y="389">7</text>
    <rect class="button" x="160" y="344" width="80" height="62" rx="6"/>
    <text class="num-on-btn" x="200" y="359">39</text>
    <text class="keypad-digit" x="200" y="389">8</text>
    <rect class="button" x="255" y="344" width="80" height="62" rx="6"/>
    <text class="num-on-btn" x="295" y="359">40</text>
    <text class="keypad-digit" x="295" y="389">9</text>

    <rect class="button" x="65"  y="426" width="80" height="62" rx="6"/>
    <text class="num-on-btn" x="105" y="441">5</text>
    <text class="keypad-word" x="105" y="463">ENTER</text>
    <text class="lbl-on-btn" x="105" y="478">★ / *</text>
    <rect class="button" x="160" y="426" width="80" height="62" rx="6"/>
    <text class="num-on-btn" x="200" y="441">31</text>
    <text class="keypad-digit" x="200" y="471">0</text>
    <rect class="button" x="255" y="426" width="80" height="62" rx="6"/>
    <text class="num-on-btn" x="295" y="441">6</text>
    <text class="keypad-word" x="295" y="463">CLEAR</text>
    <text class="lbl-on-btn" x="295" y="478"># / ♯</text>

    <text class="figcap" x="200" y="640">FIG. 2</text>
    <text class="subcap" x="200" y="660">keypad (INTV / Coleco) — slots 31 – 40</text>
  </g>
</svg>
